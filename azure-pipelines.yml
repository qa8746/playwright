trigger: none

schedules:
  - cron: '0 0 * * *'
    displayName: Daily midnight run
    branches:
      include:
        - master
    always: true

pr:
  branches:
    include:
      - main
      - master
    
pool:
  vmImage: windows-latest

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Use Node.js 20

  - script: npm ci
    displayName: Install npm dependencies

  - script: npx playwright install --with-deps chromium
    displayName: Install Playwright Chromium

  - script: call npm run test:headed
    displayName: Run Cucumber tests

  - task: PublishPipelineArtifact@1
    displayName: Publish Cucumber report
    condition: always()
    inputs:
      targetPath: reports
      artifact: cucumber-report
      publishLocation: pipeline

  - pwsh: |
      $reportPath = Join-Path $env:BUILD_SOURCESDIRECTORY 'reports/cucumber-report.html'
      if (-not (Test-Path $reportPath)) {
        throw "Cucumber HTML report was not generated: $reportPath"
      }

      $reportBytes = [System.IO.File]::ReadAllBytes($reportPath)
      $reportBase64 = [System.Convert]::ToBase64String($reportBytes)
      $result = if ($env:AGENT_JOBSTATUS -eq 'Succeeded') { 'Succeeded' } else { 'Failed' }
      $payload = @{
        personalizations = @(@{
          to = @(@{ email = 'renukaprasadml1999@gmail.com' })
          subject = "Playwright Cucumber report - $env:BUILD_BUILDNUMBER ($result)"
        })
        from = @{ email = $env:SENDGRID_FROM_EMAIL }
        content = @(@{
          type = 'text/plain'
          value = "The Playwright Cucumber pipeline completed with status: $result. The HTML report is attached."
        })
        attachments = @(@{
          content = $reportBase64
          type = 'text/html'
          filename = 'cucumber-report.html'
          disposition = 'attachment'
        })
      } | ConvertTo-Json -Depth 10

      Invoke-RestMethod -Method Post `
        -Uri 'https://api.sendgrid.com/v3/mail/send' `
        -Headers @{ Authorization = "Bearer $env:SENDGRID_API_KEY" } `
        -ContentType 'application/json' `
        -Body $payload
    displayName: Email Cucumber report
    condition: always()
    env:
      SENDGRID_API_KEY: $(SENDGRID_API_KEY)
      SENDGRID_FROM_EMAIL: $(SENDGRID_FROM_EMAIL)